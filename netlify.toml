[build]
  functions = "netlify/functions"
  # Skip deploys when only frontend files change. Only netlify/functions,
  # site config and npm manifests trigger a build.
  ignore = "git rev-parse --verify HEAD^ >/dev/null 2>&1 || exit 1; git diff --quiet HEAD^ HEAD -- netlify/ netlify.toml package.json package-lock.json .nvmrc || exit 1"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["nodemailer"]