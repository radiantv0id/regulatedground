<svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Transparent background - ready for web integration -->
  <!-- Filled shapes: triangles olive-green, circle black -->

  <!-- Upright triangle -->
  <polygon
    points="150,20 205,105 95,105"
    fill="#5f6b3f"
    stroke="none"
  />

  <!-- Perfect circle -->
  <circle
    cx="150"
    cy="160"
    r="40"
    fill="#000000"
    stroke="none"
  />

  <!-- Inverted triangle -->
  <polygon
    points="150,300 205,215 95,215"
    fill="#5f6b3f"
    stroke="none"
  />
</svg>
